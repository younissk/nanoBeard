<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanoBeard chat</title>
<style>
  /* Palette lifted from web/index.html so the playground and the site match. */
  :root {
    --ink: #2b1d12; --parchment: #f4e9d8; --tan: #d8c4ad;
    --rope: #7a4f2e; --rope-dark: #5a3a22; --gold: #b8860b; --gold-light: #e0b04a;
    --muted: #6b5844;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--ink); color: var(--parchment);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--rope-dark);
    border-bottom: 2px solid var(--gold);
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .04em; color: var(--gold-light); }
  select, button, input[type=number] {
    font: inherit; font-size: 13px; color: var(--parchment);
    background: var(--rope); border: 1px solid var(--gold); border-radius: 4px;
    padding: 4px 8px;
  }
  select { max-width: 46vw; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--gold); color: var(--ink); }
  button:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
  label { font-size: 12px; color: var(--tan); display: inline-flex; gap: 5px; align-items: center; }
  input[type=number] { width: 68px; }

  #sysbox, #toolbox { padding: 10px 16px; background: #241810; border-bottom: 1px solid var(--rope); }
  #sysbox label, #toolbox label { display: block; margin-bottom: 5px; }
  #sysbox textarea, #toolbox textarea {
    width: 100%; font: inherit; font-size: 13px; resize: vertical;
    background: var(--rope-dark); color: var(--parchment);
    border: 1px solid var(--rope); border-radius: 5px; padding: 8px;
  }
  #sysbox textarea:focus { outline: none; border-color: var(--gold); }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 16px; display: flex; gap: 10px; }
  .who {
    flex: 0 0 62px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .06em; padding-top: 2px;
  }
  .msg.user .who { color: var(--muted); }
  .msg.bot .who { color: var(--gold-light); }
  .text { white-space: pre-wrap; word-break: break-word; flex: 1; }
  .msg.bot .text { color: var(--parchment); }
  .msg.user .text { color: var(--tan); }
  .note { color: var(--muted); font-size: 13px; font-style: italic; }
  .err { color: #e07a5f; }
  .think {
    border-left: 2px solid var(--muted); padding: 4px 0 4px 10px; margin-bottom: 8px;
    color: var(--muted); font-size: 13px; font-style: italic; white-space: pre-wrap;
  }
  .think-label { font-style: normal; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  .toolcall {
    border: 1px solid var(--gold); border-radius: 5px; padding: 8px 10px; margin: 6px 0;
    background: rgba(184,134,11,.10); font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .toolcall .fn { color: var(--gold-light); }
  .searchstep {
    border-left: 3px solid var(--gold); padding: 6px 0 6px 10px; margin: 6px 0;
    font-size: 13px;
  }
  .searchstep .q { color: var(--gold-light); font-family: ui-monospace, Menlo, monospace; }
  .searchstep .hits { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .invalid { color: #e07a5f; font-style: italic; white-space: pre-wrap; }
  .toolresult { display: flex; gap: 6px; margin-top: 6px; }
  .toolresult input {
    flex: 1; font: inherit; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace;
    background: var(--rope-dark); color: var(--parchment);
    border: 1px solid var(--rope); border-radius: 4px; padding: 5px 7px;
  }
  .cursor::after { content: "▍"; color: var(--gold); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  footer { border-top: 1px solid var(--rope); padding: 12px 16px; background: #241810; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 9px 11px; border-radius: 5px;
    background: var(--rope-dark); color: var(--parchment);
    border: 1px solid var(--rope); min-height: 44px; max-height: 180px;
  }
  textarea:focus { outline: none; border-color: var(--gold); }
  #status { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>⚓ nanoBeard</h1>
  <select id="model" title="Switching restarts llama-server"></select>
  <label>temp <input type="number" id="temperature" value="0.8" step="0.05" min="0" max="2"></label>
  <label>top-k <input type="number" id="top_k" value="40" step="1" min="0"></label>
  <label>max <input type="number" id="max_tokens" value="200" step="10" min="16"></label>
  <label><input type="checkbox" id="thinking"> think</label>
  <label><input type="checkbox" id="usetools"> tools</label>
  <label id="searchwrap" hidden><input type="checkbox" id="usesearch"> wiki search</label>
  <button id="sysbtn" type="button">System…</button>
  <button id="toolbtn" type="button">Tools…</button>
  <button id="clear" type="button">Clear</button>
  <button id="regen" type="button">Regenerate</button>
</header>

<div id="sysbox" hidden>
  <label for="system">System prompt — the persona lives here. Edit and send a message to try it.</label>
  <textarea id="system" rows="3"></textarea>
</div>

<div id="toolbox" hidden>
  <label for="tools">Tool schemas (OpenAI format). Tick <b>tools</b> above to offer them.
    A 0.6B model only calls a tool if one plainly fits — try "what's the weather in Vienna?"</label>
  <textarea id="tools" rows="8"></textarea>
</div>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <form id="form">
    <textarea id="input" placeholder="Say something to the pirate…  (Enter to send, Shift+Enter for a newline)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div id="status"></div>
</footer>

<script>
// Conversation state, in the same shape the server renders into the SFT
// transcript: [{role: "user"|"bot", text}].
let turns = [];
let busy = false;

const $ = (id) => document.getElementById(id);
const wrap = $("wrap"), log = $("log"), status = $("status");

function opts() {
  return {
    temperature: parseFloat($("temperature").value),
    top_k: parseInt($("top_k").value, 10),
    max_tokens: parseInt($("max_tokens").value, 10),
    system: $("system").value,
    thinking: $("thinking").checked,
    tools: toolSchemas(),
    search: $("usesearch").checked,
    max_searches: 3,
  };
}

const DEFAULT_TOOLS = [
  {type:"function",function:{name:"get_weather",description:"Current weather for a location",
    parameters:{type:"object",properties:{location:{type:"string"},unit:{type:"string",enum:["celsius","fahrenheit"]}},required:["location"]}}},
  {type:"function",function:{name:"send_message",description:"Send a message to a contact",
    parameters:{type:"object",properties:{recipient:{type:"string"},body:{type:"string"}},required:["recipient","body"]}}},
  {type:"function",function:{name:"set_timer",description:"Set a countdown timer",
    parameters:{type:"object",properties:{seconds:{type:"integer"},label:{type:"string"}},required:["seconds"]}}},
];

// Returns null when tools are off, so the server simply omits them.
function toolSchemas() {
  if (!$("usetools").checked) return null;
  try {
    const v = JSON.parse($("tools").value);
    return Array.isArray(v) && v.length ? v : null;
  } catch (e) {
    fail("tool schemas are not valid JSON: " + e.message);
    return null;
  }
}

$("toolbtn").addEventListener("click", () => { $("toolbox").hidden = !$("toolbox").hidden; });
$("usetools").addEventListener("change", () => {
  if ($("usetools").checked) $("toolbox").hidden = false;
});

$("sysbtn").addEventListener("click", () => { $("sysbox").hidden = !$("sysbox").hidden; });

function render() {
  wrap.innerHTML = "";
  if (!turns.length) {
    wrap.innerHTML = '<p class="note">Say something. Edit the system prompt above to change the persona — clearing it gives you the base model.</p>';
    return;
  }
  let lastText = null;
  turns.forEach((t, idx) => {
    const row = document.createElement("div");
    const who = t.role === "user" ? "You" : t.role === "tool" ? "Tool" : "Pirate";
    row.className = "msg " + (t.role === "user" ? "user" : "bot");
    row.innerHTML = `<div class="who">${who}</div>`;
    const body = document.createElement("div");
    body.className = "text";

    if (t.thinking) {
      const th = document.createElement("div");
      th.className = "think";
      th.innerHTML = '<div class="think-label">thinking</div>';
      const tt = document.createElement("span");
      tt.textContent = t.thinking;
      th.appendChild(tt);
      body.appendChild(th);
    }

    (t.searches || []).forEach((s) => {
      const card = document.createElement("div");
      card.className = "searchstep";
      card.innerHTML = `<span class="q">&#128269; ${s.query}</span>`
        + `<div class="hits">${(s.results || []).join(" &middot; ") || "no matches"}</div>`;
      body.appendChild(card);
    });

    if (t.invalid) {
      const d2 = document.createElement("div");
      d2.className = "invalid";
      d2.textContent = "no <answer> tag — it wrote prose instead:\n" + t.invalid;
      body.appendChild(d2);
    }

    (t.tool_calls || []).forEach((tc) => {
      const card = document.createElement("div");
      card.className = "toolcall";
      const fn = tc.function || {};
      card.innerHTML = `<span class="fn">→ ${fn.name || "?"}</span>(${fn.arguments || ""})`;
      body.appendChild(card);

      // Feeding a result back is the only way to see the turn the model would
      // actually say to a user; without it the loop stops at the JSON.
      const alreadyAnswered = turns[idx + 1] && turns[idx + 1].role === "tool";
      if (!alreadyAnswered) {
        const box = document.createElement("div");
        box.className = "toolresult";
        const inp = document.createElement("input");
        inp.placeholder = '{"result": "..."} — a made-up result is fine';
        inp.value = '{"ok": true}';
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Send result";
        btn.onclick = () => {
          turns.push({ role: "tool", name: fn.name, text: inp.value });
          render();
          stream();
        };
        box.appendChild(inp); box.appendChild(btn);
        body.appendChild(box);
      }
    });

    const span = document.createElement("span");
    span.textContent = t.text || "";
    body.appendChild(span);
    row.appendChild(body);
    wrap.appendChild(row);
    lastText = span;
  });
  log.scrollTop = log.scrollHeight;
  return lastText;
}

function setBusy(on, msg) {
  busy = on;
  $("send").disabled = on;
  $("model").disabled = on || $("model").dataset.attached === "1";
  $("regen").disabled = on || !turns.length;
  status.textContent = msg || "";
  status.className = "";
}

function fail(msg) {
  status.textContent = msg;
  status.className = "err";
}

async function loadModels() {
  const r = await fetch("/api/models");
  const d = await r.json();
  const sel = $("model");
  sel.innerHTML = "";
  if (d.attached) {
    sel.dataset.attached = "1";
    sel.innerHTML = `<option>attached: ${d.attached}</option>`;
    sel.disabled = true;
    return;
  }
  if (!d.models.length) {
    sel.innerHTML = "<option>no GGUFs found</option>";
    sel.disabled = true;
    return;
  }
  if (typeof d.system === "string" && !$("system").value) $("system").value = d.system;
  // The search tool needs an index loaded server-side, so only offer it if there is one.
  if (d.search) $("searchwrap").hidden = false;
  if (!$("tools").value) $("tools").value = JSON.stringify(DEFAULT_TOOLS, null, 2);
  for (const m of d.models) {
    const o = document.createElement("option");
    o.value = m.path;
    o.textContent = `${m.label}  (${m.size_mb} MB)`;
    if (m.path === d.current) o.selected = true;
    sel.appendChild(o);
  }
}

$("model").addEventListener("change", async (e) => {
  const path = e.target.value;
  setBusy(true, "loading model…");
  try {
    const r = await fetch("/api/model", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    turns = [];
    render();
    setBusy(false, "loaded " + path.split("/").pop());
  } catch (err) {
    setBusy(false);
    fail(String(err.message || err));
  }
});

$("clear").addEventListener("click", () => { turns = []; render(); setBusy(false, ""); });

$("regen").addEventListener("click", () => {
  if (busy || !turns.length) return;
  // Drop trailing bot turns so the same user message is answered again.
  while (turns.length && turns[turns.length - 1].role === "bot") turns.pop();
  if (!turns.length) return render();
  stream();
});

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = "";
  turns.push({ role: "user", text });
  render();
  stream();
});

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

async function stream() {
  setBusy(true, "generating…");
  turns.push({ role: "bot", text: "" });
  let node = render();
  node.classList.add("cursor");

  let r;
  try {
    r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ turns: turns.slice(0, -1), ...opts() }),
    });
  } catch (err) {
    node.classList.remove("cursor");
    setBusy(false); fail("request failed: " + err);
    return;
  }
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    turns.pop(); render();
    setBusy(false); fail(d.error || `HTTP ${r.status}`);
    return;
  }

  // Server-sent events, parsed by hand: EventSource cannot POST.
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split("\n\n");
    buf = parts.pop();
    for (const part of parts) {
      if (!part.startsWith("data:")) continue;
      const ev = JSON.parse(part.slice(5));
      if (ev.error) { node.classList.remove("cursor"); setBusy(false); fail(ev.error); return; }
      if (ev.done) {
        node.classList.remove("cursor");
        // Re-render so a completed tool call gets its "send result" box.
        const last = turns[turns.length - 1];
        if (last.tool_calls && last.tool_calls.length) render();
        setBusy(false, ev.reason === "length" ? "hit the token limit" : "");
        return;
      }
      const cur = turns[turns.length - 1];
      if (ev.thinking) {
        cur.thinking = (cur.thinking || "") + ev.thinking;
        node = render();
        continue;
      }
      if (ev.search) {
        cur.searches = cur.searches || [];
        cur.searches.push({ query: ev.search, results: ev.results || [] });
        node = render();
        continue;
      }
      if (ev.final_answer) {
        cur.text = ev.final_answer;
        node = render();
        continue;
      }
      if (ev.invalid) {
        cur.invalid = ev.invalid;
        node = render();
        continue;
      }
      if (ev.tool_call) {
        cur.tool_calls = cur.tool_calls || [];
        const i = ev.tool_call.index || 0;
        cur.tool_calls[i] = cur.tool_calls[i] || { type: "function", function: { name: "", arguments: "" } };
        cur.tool_calls[i].function.name += ev.tool_call.name;
        cur.tool_calls[i].function.arguments += ev.tool_call.arguments;
        continue;
      }
      cur.text += ev.content || "";
      // Qwen3 emits its chain of thought inline when the server does not split
      // it out; hoist it so it renders as a thinking block, not as the answer.
      const m = cur.text.match(/^\s*<think>([\s\S]*?)<\/think>\s*/);
      if (m) { cur.thinking = m[1].trim(); cur.text = cur.text.slice(m[0].length); node = render(); }
      else node.textContent = cur.text;
      log.scrollTop = log.scrollHeight;
    }
  }
  node.classList.remove("cursor");
  setBusy(false);
}

loadModels().then(render).catch((e) => fail("could not list models: " + e));
</script>
</body>
</html>
