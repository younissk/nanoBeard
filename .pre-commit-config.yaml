repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # The rejection-sampling and self-play runs are deliberately tracked
        # (see .gitignore) and two of them are a few MB. Everything else still
        # trips the guard.
        exclude: ^runs/(rejection|selfplay)/
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.402
    hooks:
      - id: pyright
        # Run only on staged files for speed; full repo check happens via `make typecheck` / CI.
        pass_filenames: true
        additional_dependencies: []
